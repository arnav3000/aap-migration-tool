# Reverse proxy for the aap-bridge-ui container.
# Same-origin /api/v1 -> FastAPI (service name aap-bridge-api on port 8000),
# so the browser never needs API CORS. Everything else serves the Vite build.
upstream aap_bridge_api {
  server aap-bridge-api:8000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /opt/app-root/src;
  index index.html;

  # Security headers (static UI; API has its own auth + throttling).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://aap_bridge_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Job console polling + artifact downloads can be slow; allow long waits.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Cap artifact downloads at the API's 32 MiB limit + headroom.
    client_max_body_size 40m;
  }

  # SPA fallback: serve index.html for client-side routes (/jobs/:id, ...).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Hashed Vite assets can be cached aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
