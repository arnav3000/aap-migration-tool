# Main nginx config for the aap-bridge-ui image, modeled on the documented
# ubi9/nginx-126 Dockerfile approach (sclorg/nginx-container examples/1.26):
# a complete nginx.conf replaces /etc/nginx/nginx.conf, and the image runs
# `nginx -g "daemon off;"` (see ui/Containerfile CMD). Paths respect the
# base image's non-root layout: pid/logs under /run and /var/log/nginx
# (both chowned to UID 1001), content root /opt/app-root/src.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # FastAPI backend (compose service name). Same-origin /api/v1 calls from
    # the browser land here, so the API needs no CORS configuration.
    upstream aap_bridge_api {
        server aap-bridge-api:8000;
        keepalive 16;
    }

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;
        root         /opt/app-root/src;
        index        index.html;

        # Security headers (static UI; API has its own auth + throttling).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        location /api/ {
            proxy_pass http://aap_bridge_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Job console polling + artifact downloads can be slow; allow long waits.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # Cap artifact downloads at the API's 32 MiB limit + headroom.
            client_max_body_size 40m;
        }

        # SPA fallback: serve index.html for client-side routes (/jobs/:id, ...).
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Hashed Vite assets can be cached aggressively.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
