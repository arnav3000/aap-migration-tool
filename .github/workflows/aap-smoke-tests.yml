name: AAP Smoke Tests

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: aap-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requires-aap:
    name: Run requires_aap smoke tests
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'requires-aap')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Run requires_aap containerized tests
        run: make c-test-aap
