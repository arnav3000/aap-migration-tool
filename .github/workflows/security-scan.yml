name: Security & Quality Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Sundays at midnight UTC
  - cron: 0 0 * * 0
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install pip-audit
      run: python -m pip install pip-audit

    - name: Scan dependencies with pip-audit
      run: |
        pip-audit --requirement requirements.txt --format json --output pip-audit-report.json || true
        pip-audit --requirement requirements.txt

    - name: Upload pip-audit results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pip-audit-report
        path: pip-audit-report.json
        retention-days: 30

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0    # Full history for comprehensive scan

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sast-bandit:
    name: Security Analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Bandit
      # Pinned to the pre-commit rev (1.8.3 = min version with B608).
      run: python -m pip install "bandit[toml]==1.8.3"

    - name: Run Bandit security scan
      # Same skips as the pre-commit hook (pyproject.toml) plus `-ll`
      # (Medium severity and above): the tree carries pervasive Low
      # findings (try/except/pass, asserts) that can never all be
      # removed, so the gate fails only on new Medium+ findings. The 3
      # reviewed B608 HTML-template false positives are skipped in
      # pyproject.toml (Semgrep remains the injection backstop).
      run: |
        bandit -c pyproject.toml -r src/ -f json -o bandit-report.json || true
        bandit -c pyproject.toml -r src/ -f txt -ll

    - name: Upload Bandit results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
        retention-days: 30

  sast-semgrep:
    name: Security Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep
      run: semgrep scan --config auto --json --output semgrep-report.json || true

    - name: Upload Semgrep results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: semgrep-report.json
        retention-days: 30

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
          # Full history: the changed-files diff below needs the base ref.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Ruff
        # Pinned to the pre-commit revision so CI enforces the same rules
        # developers already run locally (unpinned latest flags 140+
        # pre-existing violations in untouched files).
      run: python -m pip install "ruff==0.6.8"

    - name: Get changed Python files
      id: changed
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE="${{ github.event.pull_request.base.sha }}"
        else
          BASE="origin/main"
        fi
          # ACMR: skip Deleted files (ruff E902s on missing paths).
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.py' | tr '\n' ' ')
        echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # Same scope as the pre-commit hooks (changed files only): the tree
      # carries pre-existing violations outside any PR's diff, so a
      # whole-tree gate can never pass until those are cleaned up.
    - name: Run Ruff linter
      if: steps.changed.outputs.files != ''
      run: ruff check --output-format=github ${{ steps.changed.outputs.files }}

    - name: Run Ruff formatter check
      if: steps.changed.outputs.files != ''
      run: ruff format --check ${{ steps.changed.outputs.files }}

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-licenses
        pip install -r requirements.txt

    - name: Generate license report
      run: |
        pip-licenses --format=markdown --output-file=licenses.md
        pip-licenses --format=json --output-file=licenses.json

    - name: Check for GPL-incompatible licenses
      run: |
        pip-licenses --format=plain-vertical | tee licenses.txt
        # Fail if any proprietary or incompatible licenses found
        # Allowed: MIT, BSD, Apache-2.0, GPL, LGPL, PSF, ISC, MPL
        if grep -iE "(commercial|proprietary)" licenses.txt; then
          echo "ERROR: Found incompatible licenses"
          exit 1
        fi

    - name: Upload license reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: license-reports
        path: |
          licenses.md
          licenses.json
          licenses.txt
        retention-days: 90

  sbom-generation:
    name: Generate SBOM (Software Bill of Materials)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "cyclonedx-bom==7.5.0"
        pip install -r requirements.txt

    - name: Generate CycloneDX SBOM
      run: |
        cyclonedx-py environment -o sbom.json --of JSON
        cyclonedx-py environment -o sbom.xml --of XML

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: |
          sbom.json
          sbom.xml
        retention-days: 90

  filesystem-scan:
    name: Filesystem Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH,MEDIUM
        limit-severities-for-sarif: true

    - name: Upload Trivy results to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif

    - name: Run Trivy for JSON output
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        format: json
        output: trivy-results.json

    - name: Upload Trivy JSON results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: trivy-results.json
        retention-days: 30

  container-image-scan:
    name: Container Image Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build container image
      run: docker build -t aap-migration-tool:scan -f container/Containerfile .

    - name: Run Trivy image scan (SARIF)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: aap-migration-tool:scan
        format: sarif
        output: trivy-image-results.sarif
        severity: CRITICAL,HIGH
        limit-severities-for-sarif: true

    - name: Upload image scan to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-image-results.sarif
        category: container-image

    - name: Run Trivy image scan (table)
      if: always()
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: aap-migration-tool:scan
        format: table
        severity: CRITICAL,HIGH

    - name: Run Trivy image scan (JSON)
      if: always()
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: aap-migration-tool:scan
        format: json
        output: trivy-image-results.json

    - name: Upload Trivy image results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-report
        path: trivy-image-results.json
        retention-days: 30

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, sast-bandit, sast-semgrep, code-quality, license-compliance, sbom-generation, filesystem-scan, container-image-scan]
    if: always()
    steps:
    - name: Check job results
      run: |
        echo "Security Scan Summary:"
        echo "======================"
        echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
        echo "Secret Detection: ${{ needs.secret-scan.result }}"
        echo "SAST (Bandit): ${{ needs.sast-bandit.result }}"
        echo "SAST (Semgrep): ${{ needs.sast-semgrep.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "License Compliance: ${{ needs.license-compliance.result }}"
        echo "SBOM Generation: ${{ needs.sbom-generation.result }}"
        echo "Filesystem Scan: ${{ needs.filesystem-scan.result }}"
        echo "Container Image Scan: ${{ needs.container-image-scan.result }}"
